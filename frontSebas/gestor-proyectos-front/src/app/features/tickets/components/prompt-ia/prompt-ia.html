<section class="tarjeta ia">
  <div class="cabecera">
    <h2><i class="bi bi-stars"></i> Trabajar con IA</h2>
    <small>Prompt generado con los datos de este ticket</small>
  </div>

  <div class="tareas" role="tablist" aria-label="Qué quieres hacer">
    @for (t of tareas; track t.id) {
      <button type="button" role="tab" [attr.aria-selected]="tarea() === t.id" [class.activa]="tarea() === t.id"
              (click)="tarea.set(t.id)">{{ t.texto }}</button>
    }
  </div>

  <div class="incluir">
    <span>Incluir:</span>
    @for (s of secciones; track s.id) {
      <button type="button" [class.activa]="incluir().has(s.id)" [attr.aria-pressed]="incluir().has(s.id)"
              (click)="alternar(s.id)">
        <i class="bi" [class.bi-check]="incluir().has(s.id)" [class.bi-plus]="!incluir().has(s.id)"></i> {{ s.texto }}
      </button>
    }
  </div>

  <pre class="prompt">{{ prompt() }}</pre>

  <div class="pie">
    <button type="button" class="boton boton-primario chico" (click)="copiar()">
      <i class="bi" [class.bi-clipboard]="!copiado()" [class.bi-clipboard-check]="copiado()"></i>
      {{ copiado() ? 'Copiado' : 'Copiar prompt' }}
    </button>
    <button type="button" class="boton boton-secundario chico" (click)="descargar()">
      <i class="bi bi-download"></i> Descargar .md
    </button>
    <span class="seguro"><i class="bi bi-shield-check"></i> Sin credenciales ni datos del cliente</span>
  </div>
</section>
