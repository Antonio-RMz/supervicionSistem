<main class="pantalla">
  <app-fondo-circuito />

  <section class="presentacion">
    <app-logo-inova [sobreOscuro]="true" [tamano]="64" />
    <p>PORTAL DE CLIENTES</p>
  </section>
  <section class="tarjeta">
    <div class="logo"><app-logo-inova [tamano]="44" /></div>

    <h1>Iniciar sesión</h1>
    <p class="bajada">Portal de clientes</p>

    <form [formGroup]="login.form" (ngSubmit)="login.entrar()" novalidate>
      <label class="campo">
        <span>Correo electrónico</span>
        <div class="entrada" [class.con-error]="login.invalido('correo')">
          <i class="bi bi-envelope"></i>
          <input type="email" formControlName="correo" placeholder="tu.correo@empresa.com" autocomplete="email" inputmode="email" />
        </div>
        @if (login.invalido('correo')) {
          <small class="mensaje-campo">Escribe un correo válido.</small>
        }
      </label>

      <label class="campo">
        <span>Contraseña</span>
        <div class="entrada" [class.con-error]="login.invalido('password')">
          <i class="bi bi-lock"></i>
          <input [type]="login.mostrarPassword() ? 'text' : 'password'" formControlName="password"
                 placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="mostrar" (click)="login.mostrarPassword.set(!login.mostrarPassword())"
                  [attr.aria-label]="login.mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <i class="bi" [class.bi-eye]="!login.mostrarPassword()" [class.bi-eye-slash]="login.mostrarPassword()"></i>
          </button>
        </div>
        @if (login.invalido('password')) {
          <small class="mensaje-campo">Escribe tu contraseña.</small>
        }
      </label>

      <div class="opciones">
        <label class="recordarme">
          <input type="checkbox" formControlName="recordarme" />
          Recordarme
        </label>
        <button type="button" class="enlace" (click)="ayudaPassword.set(true)">¿Olvidaste tu contraseña?</button>
      </div>

      @if (ayudaPassword()) {
        <p class="aviso">Pide a tu Analista una contraseña temporal.</p>
      }

      @if (login.error()) {
        <p class="error" role="alert"><i class="bi bi-exclamation-circle"></i> {{ login.error() }}</p>
      }

      <button type="submit" class="entrar" [disabled]="login.enviando()">
        {{ login.enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="cambiar-acceso">¿Eres del equipo? <a routerLink="/login">Entra aquí</a></p>
  </section>
</main>
