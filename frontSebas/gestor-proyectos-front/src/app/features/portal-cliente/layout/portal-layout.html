<header class="barra">
  <div class="marca">
    <app-logo-inova [tamano]="26" />
    <div class="portal">
      <strong>Portal de avance</strong>
      <small>{{ usuario()?.clienteNombre }}</small>
    </div>
  </div>

  <nav class="menu" aria-label="Secciones del portal">
    <a routerLink="/portal/proyectos" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Mis proyectos</a>
    <a routerLink="/portal/avance" [class.activo]="enAvance()">Avance</a>
    <a routerLink="/portal/solicitudes" routerLinkActive="activo">Solicitudes</a>
    <a routerLink="/portal/versiones" routerLinkActive="activo">Versiones</a>
  </nav>

  <div class="derecha">
    @if (enAvance() && store.proyectos().length > 1) {
      <label class="selector">
        <span class="solo-lectores">Proyecto</span>
        <select (change)="cambiarProyecto($any($event.target).value)">
          @for (proyecto of store.proyectos(); track proyecto.id) {
            <option [value]="proyecto.id" [selected]="proyecto.id === store.seleccionado()?.id">{{ proyecto.nombre }}</option>
          }
        </select>
      </label>
    }

    <app-boton-tema />

    <div class="persona">
      <span class="avatar">{{ usuario()?.iniciales }}</span>
      <div class="datos">
        <strong>{{ usuario()?.nombreCompleto }}</strong>
        <small>Cliente</small>
      </div>
      <button type="button" class="salir" (click)="salir()" title="Cerrar sesión">
        <i class="bi bi-box-arrow-right"></i>
        <span class="solo-lectores">Cerrar sesión</span>
      </button>
    </div>
  </div>
</header>

<main class="contenido">
  <router-outlet />
</main>
