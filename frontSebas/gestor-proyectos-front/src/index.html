<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Inova Byte Systems</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestor de Proyectos y Portal de avance de Inova Byte Systems">
  <!-- Logo de Inova Byte Systems. El .ico es para navegadores viejos; el SVG va al final para que los demás lo prefieran. -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <!-- Tema antes de que cargue Angular (TemaService lo mantiene después) -->
  <script>
    try {
      var t = localStorage.getItem('tema');
      if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      document.documentElement.dataset.tema = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
