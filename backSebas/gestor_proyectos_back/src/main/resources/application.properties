spring.application.name=gestorproyectos

# Perfil por defecto: dev (carga los datos de ejemplo de db/demo)
spring.profiles.default=dev

jwt.secret=clave-super-secreta-minimo-32-caracteres-gestor
jwt.expiracion=86400000

spring.datasource.url=jdbc:mysql://localhost:3306/gestor_proyectos?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo maneja SOLO Flyway; Hibernate nunca crea ni cambia tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Flyway: base nueva, se crea desde V1
spring.flyway.locations=classpath:db/migration

# Un booleano o número que no viene en el JSON toma su valor por defecto (false, 0) en vez de fallar
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Imágenes de las historias: fuera del repositorio, 5 MB cada una
app.adjuntos.carpeta=${user.home}/.gestor-proyectos/adjuntos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Origen permitido para el front (Angular)
app.cors.origenes=http://localhost:4200

logging.level.root=INFO
logging.level.com.team.gestorproyectos=DEBUG
logging.level.org.springframework.security=ERROR
